name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      production_rollout:
        description: "Production rollout fraction (e.g. 0.1 for 10%, 1.0 for full rollout)"
        required: false
        default: "0.1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_release:
    name: Check Release Eligibility
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.evaluation.outputs.should_release }}
      version_code: ${{ steps.evaluation.outputs.version_code }}
      app_version: ${{ steps.evaluation.outputs.app_version }}
      release_notes: ${{ steps.evaluation.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: "npm"

      - name: Ensure npm version
        run: npm install -g npm@11.16.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Evaluate Release Conditions
        id: evaluation
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          // 1. Read constants from package.json
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const appVersion = pkg.version;
          const versionCode = parseInt(pkg.versionCode, 10);
          const expectedTag = `v${appVersion}+${versionCode}`;

          console.log(`Configured version: ${appVersion} (code: ${versionCode})`);

          // Validate tag if triggered by tag push
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            const actualTag = process.env.GITHUB_REF_NAME;
            if (actualTag !== expectedTag) {
              console.error(`Pushed tag "${actualTag}" does not match package.json "${expectedTag}". Skipping release.`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_release=false\n');
              process.exit(1);
            }
          }

          // 2. Read changelog
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const sections = changelog.split(/^## /m);

          if (sections.length < 2) {
            console.log('No valid release sections found in CHANGELOG.md. Skipping.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_release=false\n');
            process.exit(0);
          }

          const topSection = sections[1];
          const lines = topSection.split('\n');
          const heading = lines[0].trim();

          console.log(`Top changelog heading: ${heading}`);

          if (heading.toLowerCase().includes('unreleased') || heading.toLowerCase().includes('(in progress)')) {
            console.log("Top section is unreleased. Skipping build and release.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_release=false\n');
            process.exit(0);
          }

          // Extract user release notes
          let rawNotes = '';
          const userNotesMatch = topSection.match(/### user release notes\n([\s\S]*?)(?=\n### |$)/);
          if (userNotesMatch) {
            rawNotes = userNotesMatch[1].trim();
          } else {
            rawNotes = lines.slice(1).join('\n').trim();
          }

          const MAX_LEN = 500;
          const BUFFER = 10;
          const suffix = '...\n+more';
          const notes = rawNotes.length > MAX_LEN
            ? rawNotes.slice(0, MAX_LEN - suffix.length - BUFFER) + suffix
            : rawNotes;
          console.log('Extracted release notes:\n' + notes);

          // 3. Query Google Play Store internal track version codes via fastlane
          const saJson = process.env.PLAY_STORE_SERVICE_ACCOUNT_JSON;
          if (!saJson) {
            console.error('PLAY_STORE_SERVICE_ACCOUNT_JSON secret is not set.');
            process.exit(1);
          }

          const tempKeyPath = '/tmp/service-account.json';
          fs.writeFileSync(tempKeyPath, saJson);

          let maxLiveCode = 0;
          try {
            const output = execSync('bundle exec fastlane android get_internal_version_code', {
              env: { ...process.env, SUPPLY_JSON_KEY: tempKeyPath },
              encoding: 'utf8'
            });
            const match = output.match(/HIGHEST_INTERNAL_VERSION_CODE:(\d+)/);
            if (match) {
              maxLiveCode = parseInt(match[1], 10);
            }
          } catch (err) {
            console.warn('Could not query Play Store internal track (assuming 0):', err.message);
          }

          console.log(`Highest live internal track versionCode: ${maxLiveCode}`);

          if (versionCode <= maxLiveCode) {
            console.log(`Version code ${versionCode} is not greater than live internal version code ${maxLiveCode}. Skipping release.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_release=false\n');
            process.exit(0);
          }

          console.log(`New version code ${versionCode} > ${maxLiveCode}. Proceeding with release.`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_release=true\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_code=${versionCode}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `app_version=${appVersion}\n`);

          // Set multiline output for release notes
          const delimiter = 'EOF_NOTES_' + Date.now();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_notes<<${delimiter}\n${notes}\n${delimiter}\n`);
          EOF

  build_and_upload_internal:
    name: Build & Upload to Internal Track
    needs: check_release
    if: needs.check_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: "npm"

      - name: Ensure npm version
        run: npm install -g npm@11.16.0

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Pre-download & Verify Gradle 9.3.1 Distribution
        run: |
          # 1. Download Gradle 9.3.1 from mirror (sha256 matches official release)
          curl -fL --retry 5 --connect-timeout 20 -o /tmp/gradle-9.3.1-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip || \
          curl -fL --retry 5 --connect-timeout 20 -o /tmp/gradle-9.3.1-bin.zip \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip

          # 2. Verify checksum (official sha256 from gradle.org)
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle-9.3.1-bin.zip" | sha256sum -c -

          # 3. Point wrapper to local verified archive — no network needed for gradle binary
          sed -i 's|distributionUrl=.*|distributionUrl=file\\:/tmp/gradle-9.3.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/validateDistributionUrl=.*/validateDistributionUrl=false/' android/gradle/wrapper/gradle-wrapper.properties

          # 4. Configure high-performance Gradle properties and network timeouts
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          EOF

          # 5. Init script: use official google() and mavenCentral() as primary repositories,
          #    with aliyun mirrors as fallback for jetbrains/maven-central CDN outages.
          #    google() must come first so com.android.tools.* and com.google.* artifacts
          #    resolve directly instead of hitting aliyun with a 502.
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirrors.init.gradle << 'INITSCRIPT'
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://maven.aliyun.com/repository/central' }
              }
            }
            repositories {
              google()
              mavenCentral()
              maven { url 'https://maven.aliyun.com/repository/google' }
              maven { url 'https://maven.aliyun.com/repository/central' }
            }
          }
          INITSCRIPT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          build-root-directory: android

      - name: Configure Release Keystore & Patch Signing Config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 1. Decode keystore into android/app/
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

          # 2. Patch android/app/build.gradle to wire release signing and native debug symbols
          node << 'EOF'
          const fs = require('fs');
          const gradleFile = 'android/app/build.gradle';
          let content = fs.readFileSync(gradleFile, 'utf8');

          const releaseSigningBlock = [
            '        release {',
            '            if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {',
            '                storeFile file("release.keystore")',
            '                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")',
            '                keyAlias System.getenv("ANDROID_KEY_ALIAS")',
            '                keyPassword System.getenv("ANDROID_KEY_PASSWORD")',
            '            }',
            '        }'
          ].join('\n');

          // 1. Insert release signing config directly after 'signingConfigs {'
          content = content.replace('signingConfigs {', 'signingConfigs {\n' + releaseSigningBlock);

          // 2. Change release buildType to use signingConfigs.release (anchored under buildTypes { ... release {)
          content = content.replace(
            /(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug/,
            '$1signingConfig signingConfigs.release'
          );

          // 3. Ensure ndk debugSymbolLevel 'SYMBOL_TABLE' is present in release buildType
          if (!content.includes('debugSymbolLevel')) {
            content = content.replace(
              /(buildTypes\s*\{[\s\S]*?release\s*\{)/,
              '$1\n            ndk {\n                debugSymbolLevel "SYMBOL_TABLE"\n            }'
            );
          } else {
            content = content.replace(
              /debugSymbolLevel\s+['"][^'"]+['"]/,
              'debugSymbolLevel "SYMBOL_TABLE"'
            );
          }

          // 4. Disable checkReleaseBuilds in lint to skip redundant lint analysis during release
          if (!content.includes('checkReleaseBuilds')) {
            content = content.replace(
              /android\s*\{/,
              'android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }'
            );
          }

          fs.writeFileSync(gradleFile, content);
          console.log('Successfully patched android/app/build.gradle for release signing, debug symbols, and lint.');

          // 5. Ensure gradle.properties enables minification and allocates sufficient heap
          const propsFile = 'android/gradle.properties';
          if (fs.existsSync(propsFile)) {
            let props = fs.readFileSync(propsFile, 'utf8');
            if (!props.includes('android.enableMinifyInReleaseBuilds')) {
              props += '\nandroid.enableMinifyInReleaseBuilds=true\n';
            }
            if (!props.includes('android.enableShrinkResourcesInReleaseBuilds')) {
              props += 'android.enableShrinkResourcesInReleaseBuilds=true\n';
            }
            props = props.replace(/org\.gradle\.jvmargs=.*/, 'org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC');
            fs.writeFileSync(propsFile, props);
            console.log('Successfully verified android.enableMinifyInReleaseBuilds and jvmargs in gradle.properties.');
          }
          EOF

      - name: Verify Release Keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "error: release signing secrets are not set." >&2
            exit 1
          fi
          keytool -list -v \
            -keystore android/app/release.keystore \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | grep -E "Alias name:|SHA1:|SHA256:"
          echo "Compare these fingerprints with the legacy upload key in Play Console → App integrity."

      - name: Setup Bundletool
        run: |
          mkdir -p /opt/bundletool
          curl -fL --retry 3 --connect-timeout 20 -o /opt/bundletool/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      - name: Write Fastlane Release Notes
        env:
          RELEASE_NOTES: ${{ needs.check_release.outputs.release_notes }}
          VERSION_CODE: ${{ needs.check_release.outputs.version_code }}
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          node -e 'fs.writeFileSync(`fastlane/metadata/android/en-US/changelogs/${process.env.VERSION_CODE}.txt`, process.env.RELEASE_NOTES || "");'
          echo "Release notes written to fastlane/metadata/android/en-US/changelogs/${{ needs.check_release.outputs.version_code }}.txt"

      - name: Build Android Release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --max-workers=2 --build-cache

      - name: Generate Universal APK with Bundletool
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_PASSWORD" > /tmp/ks-pass.txt
          echo "$ANDROID_KEY_PASSWORD" > /tmp/key-pass.txt

          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          APKS_FILE="android/app/build/outputs/bundle/release/app-release.apks"
          APK_DIR="android/app/build/outputs/apk/release"

          mkdir -p "$APK_DIR"
          java -jar /opt/bundletool/bundletool.jar build-apks \
            --bundle="$AAB_FILE" \
            --output="$APKS_FILE" \
            --mode=universal \
            --ks="android/app/release.keystore" \
            --ks-pass=file:/tmp/ks-pass.txt \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=file:/tmp/key-pass.txt

          rm -f /tmp/ks-pass.txt /tmp/key-pass.txt

          unzip -p "$APKS_FILE" universal.apk > "$APK_DIR/app-release.apk"
          echo "Universal APK generated successfully at $APK_DIR/app-release.apk"

      - name: Verify Release Build Outputs & Debug Symbols
        run: |
          echo "Checking build outputs..."
          ls -la android/app/build/outputs/bundle/release/ || true
          ls -la android/app/build/outputs/apk/release/ || true
          ls -la android/app/build/outputs/mapping/release/ || true
          ls -la android/app/build/outputs/native-debug-symbols/release/ || true

          # If native-debug-symbols.zip was not automatically output, extract from AAB metadata or merged libs
          if [ ! -f android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ]; then
            mkdir -p android/app/build/outputs/native-debug-symbols/release
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            if [ -f "$AAB" ] && unzip -l "$AAB" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols/"; then
              echo "Extracting native debug symbols from AAB metadata..."
              TEMP_SYM_DIR=$(mktemp -d)
              unzip -q "$AAB" "BUNDLE-METADATA/com.android.tools.build.debugsymbols/*" -d "$TEMP_SYM_DIR"
              (cd "$TEMP_SYM_DIR/BUNDLE-METADATA/com.android.tools.build.debugsymbols" && zip -r - .) > android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
              rm -rf "$TEMP_SYM_DIR"
            else
              MERGED_LIBS_DIR=$(find android/app/build/intermediates/merged_native_libs/release -type d -name "lib" 2>/dev/null | head -n 1)
              if [ -n "$MERGED_LIBS_DIR" ] && [ -d "$MERGED_LIBS_DIR" ]; then
                echo "Packaging native-debug-symbols.zip from $MERGED_LIBS_DIR..."
                (cd "$MERGED_LIBS_DIR" && zip -r - .) > android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
              fi
            fi
          fi

      - name: Upload Release AAB Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ needs.check_release.outputs.version_code }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload Release APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ needs.check_release.outputs.version_code }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload R8 Mapping File Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapping-v${{ needs.check_release.outputs.version_code }}.txt
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Native Debug Symbols Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols-v${{ needs.check_release.outputs.version_code }}.zip
          path: android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Upload AAB to Google Play Store Internal Track
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
          export SUPPLY_JSON_KEY=/tmp/service-account.json
          bundle exec fastlane android upload_internal \
            aab_path:android/app/build/outputs/bundle/release/app-release.aab \
            mapping_paths:android/app/build/outputs/mapping/release/mapping.txt,android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

  promote_to_closed:
    name: Promote to Closed Testing (Alpha)
    needs: [check_release, build_and_upload_internal]
    if: needs.check_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: closed-testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write Fastlane Release Notes
        env:
          RELEASE_NOTES: ${{ needs.check_release.outputs.release_notes }}
          VERSION_CODE: ${{ needs.check_release.outputs.version_code }}
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          node -e 'fs.writeFileSync(`fastlane/metadata/android/en-US/changelogs/${process.env.VERSION_CODE}.txt`, process.env.RELEASE_NOTES || "");'

      - name: Promote Release via Fastlane
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
          export SUPPLY_JSON_KEY=/tmp/service-account.json
          bundle exec fastlane android promote_to_closed version_code:${{ needs.check_release.outputs.version_code }}

  promote_to_open:
    name: Promote to Open Testing (Beta)
    needs: [check_release, promote_to_closed]
    if: needs.check_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: open-testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write Fastlane Release Notes
        env:
          RELEASE_NOTES: ${{ needs.check_release.outputs.release_notes }}
          VERSION_CODE: ${{ needs.check_release.outputs.version_code }}
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          node -e 'fs.writeFileSync(`fastlane/metadata/android/en-US/changelogs/${process.env.VERSION_CODE}.txt`, process.env.RELEASE_NOTES || "");'

      - name: Promote Release via Fastlane
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
          export SUPPLY_JSON_KEY=/tmp/service-account.json
          bundle exec fastlane android promote_to_open version_code:${{ needs.check_release.outputs.version_code }}

  promote_to_production:
    name: Promote to Production
    needs: [check_release, promote_to_open]
    if: needs.check_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write Fastlane Release Notes
        env:
          RELEASE_NOTES: ${{ needs.check_release.outputs.release_notes }}
          VERSION_CODE: ${{ needs.check_release.outputs.version_code }}
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          node -e 'fs.writeFileSync(`fastlane/metadata/android/en-US/changelogs/${process.env.VERSION_CODE}.txt`, process.env.RELEASE_NOTES || "");'

      - name: Promote Release via Fastlane
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
          export SUPPLY_JSON_KEY=/tmp/service-account.json
          bundle exec fastlane android promote_to_production version_code:${{ needs.check_release.outputs.version_code }} rollout:${{ inputs.production_rollout || '0.1' }}

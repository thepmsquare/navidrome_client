apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.audiooutput'
version = '0.1.0'

android {
  namespace "expo.modules.audiooutput"
  compileSdkVersion project.hasProperty('compileSdkVersion') ? project.compileSdkVersion : 35

  defaultConfig {
    minSdkVersion project.hasProperty('minSdkVersion') ? project.minSdkVersion : 24
    targetSdkVersion project.hasProperty('targetSdkVersion') ? project.targetSdkVersion : 35
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

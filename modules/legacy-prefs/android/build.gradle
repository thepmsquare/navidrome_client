apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.legacyprefs'
version = '0.1.0'

android {
  namespace "expo.modules.legacyprefs"
  compileSdkVersion project.hasProperty('compileSdkVersion') ? project.compileSdkVersion : 35

  defaultConfig {
    minSdkVersion project.hasProperty('minSdkVersion') ? project.minSdkVersion : 24
    targetSdkVersion project.hasProperty('targetSdkVersion') ? project.targetSdkVersion : 35
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
}

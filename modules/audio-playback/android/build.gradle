apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.audioplayback'
version = '0.1.0'

android {
  namespace "expo.modules.audioplayback"
  compileSdkVersion project.hasProperty('compileSdkVersion') ? project.compileSdkVersion : 35

  defaultConfig {
    minSdkVersion project.hasProperty('minSdkVersion') ? project.minSdkVersion : 24
    targetSdkVersion project.hasProperty('targetSdkVersion') ? project.targetSdkVersion : 35
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
  implementation "androidx.media3:media3-exoplayer:1.5.1"
  implementation "androidx.media3:media3-session:1.5.1"
  implementation "androidx.media3:media3-common:1.5.1"
  implementation "androidx.media3:media3-ui:1.5.1"
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
